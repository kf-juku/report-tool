<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業報告書ツール｜クロフネ</title>
<style>
* { box-sizing: border-box; }
body { font-family: 'Hiragino Sans', sans-serif; background: #f3f4f6; margin: 0; font-size: 14px; color: #1f2937; }
.header { background: #ea580c; color: white; padding: 12px 20px; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
.common-bar { background: white; border-bottom: 2px solid #e5e7eb; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.common-bar label { font-size: 11px; font-weight: bold; color: #6b7280; margin-right: 4px; }
.common-bar input { border: 1.5px solid #e5e7eb; border-radius: 6px; padding: 6px 9px; font-size: 13px; font-family: inherit; background: #f9fafb; }
.common-bar input:focus { outline: none; border-color: #ea580c; background: white; }
.settings-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center; }
.settings-overlay.show { display:flex; }
.settings-modal { background:white; border-radius:12px; padding:28px 28px 20px; width:min(520px,95vw); max-height:90vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.18); }
.settings-modal h2 { margin:0 0 18px; font-size:17px; color:#1f2937; }
.settings-section { margin-bottom:18px; }
.settings-section label { display:block; font-size:12px; font-weight:bold; color:#6b7280; margin-bottom:5px; }
.settings-section input[type=text], .settings-section textarea { width:100%; box-sizing:border-box; border:1.5px solid #e5e7eb; border-radius:7px; padding:8px 10px; font-size:13px; font-family:inherit; background:#f9fafb; resize:vertical; }
.settings-section input[type=text]:focus, .settings-section textarea:focus { outline:none; border-color:#ea580c; background:white; }
.settings-hint { font-size:11px; color:#9ca3af; margin-top:3px; }
.settings-toggle-row { display:flex; align-items:center; gap:10px; }
.toggle-switch { position:relative; width:40px; height:22px; flex-shrink:0; }
.toggle-switch input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:#d1d5db; border-radius:22px; cursor:pointer; transition:.2s; }
.toggle-slider:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
.toggle-switch input:checked + .toggle-slider { background:#ea580c; }
.toggle-switch input:checked + .toggle-slider:before { transform:translateX(18px); }
.settings-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; padding-top:16px; border-top:1px solid #f3f4f6; flex-wrap:wrap; }
.btn-settings-save { background:#ea580c; color:white; border:none; border-radius:7px; padding:8px 20px; font-size:13px; font-weight:bold; cursor:pointer; font-family:inherit; }
.btn-settings-save:hover { background:#c2410c; }
.btn-settings-reset { background:#f3f4f6; color:#6b7280; border:none; border-radius:7px; padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit; }
.btn-settings-cancel { background:white; color:#6b7280; border:1.5px solid #e5e7eb; border-radius:7px; padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit; }
.main { padding: 12px 16px; }
.students-container { display: flex; flex-direction: column; gap: 16px; }
.student-block { background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; }
.student-header { background: #fff7ed; border-bottom: 2px solid #fed7aa; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.student-num { background: #ea580c; color: white; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
.student-name-input { border: 1.5px solid #fed7aa; border-radius: 6px; padding: 5px 10px; font-size: 14px; font-weight: bold; font-family: inherit; background: white; flex: 1; min-width: 0; max-width: 200px; }
.student-name-input:focus { outline: none; border-color: #ea580c; }
.btn-remove { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
.btn-student-reset { background: white; border: 1px solid #e5e7eb; border-radius: 6px; padding: 4px 10px; font-size: 11px; color: #6b7280; cursor: pointer; font-family: inherit; margin-left: auto; white-space: nowrap; }
.btn-student-reset:hover { border-color: #ea580c; color: #ea580c; }
.btn-remove:hover { color: #ef4444; }
.student-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.student-left { padding: 14px; border-right: 1px solid #f3f4f6; }
.student-right { padding: 0; background: #fff7ed; border-left: 3px solid #ea580c; }
.card-section { margin-bottom: 14px; }
.sec-title { font-size: 11px; font-weight: bold; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
label { display: block; font-size: 11px; font-weight: bold; color: #6b7280; margin-bottom: 3px; margin-top: 8px; }
input.field, select.field, textarea.field { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: inherit; background: #f9fafb; }
input.field:focus, select.field:focus, textarea.field:focus { outline: none; border-color: #ea580c; background: white; }
textarea.field { resize: vertical; }
.stage-unit { display: grid; grid-template-columns: 150px 1fr; gap: 8px; }
.scroll-list { border: 1.5px solid #e5e7eb; border-radius: 6px; overflow-y: auto; max-height: 200px; background: #f9fafb; }
.list-item { padding: 6px 9px; cursor: pointer; border-bottom: 1px solid #f3f4f6; font-size: 12px; line-height: 1.4; }
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: #fff7ed; }
.list-item.sel { background: #fff7ed; color: #ea580c; font-weight: bold; }
.list-item .sub { font-size: 10px; color: #9ca3af; margin-top: 1px; }
.list-item.sel .sub { color: #fb923c; }
.list-cat { padding: 3px 8px; font-size: 10px; font-weight: bold; background: #f3f4f6; color: #9ca3af; border-bottom: 1px solid #e5e7eb; cursor: default; }
.lesson-num { font-size: 11px; font-weight: bold; color: #ea580c; margin-right: 5px; white-space: nowrap; }
.stage-reset { font-size: 11px; color: #9ca3af; cursor: pointer; text-decoration: underline; margin-top: 3px; display: inline-block; }
.stage-reset:hover { color: #ea580c; }
.btn-group { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.choice { border: 1.5px solid #e5e7eb; background: white; border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #6b7280; font-family: inherit; transition: all 0.12s; }
.choice:hover { border-color: #ea580c; color: #ea580c; }
.choice.sel { background: #fff7ed; border-color: #ea580c; color: #ea580c; font-weight: bold; }
.choice.good.sel { background: #d1fae5; border-color: #10b981; color: #065f46; }
.choice.bad.sel { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
.goal { background: #f0fdf4; border: 1px solid #86efac; border-radius: 6px; padding: 7px 10px; font-size: 11px; color: #166534; margin-top: 6px; display: none; line-height: 1.6; }
.goal.show { display: block; }
.next-tabs { display: flex; gap: 5px; margin-bottom: 6px; }
.next-tab { flex: 1; border: 1.5px solid #e5e7eb; background: white; border-radius: 6px; padding: 5px 4px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; color: #6b7280; font-family: inherit; }
.next-tab.sel { border-color: #ea580c; background: #fff7ed; color: #ea580c; }
.next-panel { display: none; }
.next-panel.show { display: block; }
.out-area { padding: 14px; }
.out-name-banner { background: #ea580c; border-radius: 6px; padding: 7px 14px; margin-bottom: 10px; font-size: 14px; font-weight: bold; color: white; display: flex; align-items: center; gap: 6px; }
.out-name-banner .banner-label { font-size: 11px; font-weight: normal; color: rgba(255,255,255,0.75); margin-right: 4px; }
.out-label { font-size: 12px; font-weight: bold; color: #ea580c; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; letter-spacing: 0.03em; }
.out-box { width: 100%; background: white; border: 2px solid #fed7aa; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.9; min-height: 260px; font-family: inherit; resize: none; color: #1f2937; }
.student-body.collapsed .student-left { display: none; }
.student-body.collapsed .student-right { border-right: none; }
.btn-collapse { background: none; border: none; cursor: pointer; font-size: 13px; color: #6b7280; padding: 2px 6px; border-radius: 4px; font-family: inherit; }
.btn-collapse:hover { background: #f3f4f6; color: #374151; }
.btn-typing { background: #eff6ff; border: 1.5px solid #bfdbfe; color: #1d4ed8; border-radius:6px; padding:4px 12px; font-size:12px; font-weight:bold; cursor:pointer; font-family:inherit; white-space:nowrap; }
.btn-typing:hover { background: #dbeafe; }
.btn-typing.sel { background: #1d4ed8; color: white; border-color: #1d4ed8; }
.collapse-icon { display: inline-block; transition: transform 0.2s; }
.out-box:focus { outline: none; }
.btn-copy-ind { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
.btn-copy-ind:hover { background: #e5e7eb; }
.err-msg { font-size: 11px; color: #ef4444; margin-top: 3px; display: none; }
.err-msg.show { display: block; }
.err { border-color: #ef4444 !important; background: #fff5f5 !important; }
.bottom-bar { background: white; border-top: 2px solid #e5e7eb; padding: 12px 16px; display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.btn-add { background: white; border: 2px dashed #d1d5db; border-radius: 8px; padding: 10px; font-size: 13px; cursor: pointer; color: #6b7280; font-family: inherit; flex: 1; }
.btn-add:hover { border-color: #ea580c; color: #ea580c; background: #fff7ed; }
.btn-gen-all { background: #ea580c; color: white; border: none; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: inherit; }
.btn-gen-all:hover { background: #c2410c; }
.btn-reset-all { background: #fff1f2; color: #be123c; border: 1.5px solid #fda4af; border-radius: 8px; padding: 12px 16px; font-size: 13px; font-weight: bold; cursor: pointer; font-family: inherit; }
.btn-reset-all:hover { background: #ffe4e6; border-color: #f43f5e; color: #9f1239; }
.toast { position: fixed; bottom: 70px; right: 20px; background: #1f2937; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }
@media (max-width: 700px) {
  .student-body { grid-template-columns: 1fr; }
  .student-left { border-right: none; border-bottom: 1px solid #f3f4f6; }
  .stage-unit { grid-template-columns: 120px 1fr; }
  .common-bar { gap: 8px; padding: 10px 12px; }
  .bottom-bar { flex-wrap: wrap; }
  .btn-gen-all { flex: 1; font-size: 13px; padding: 10px 8px; }
  .btn-reset-all { font-size: 12px; padding: 8px 10px; }
  .student-header { flex-wrap: wrap; gap: 6px; }
  .student-name-input { min-width: 0; flex: 1; max-width: none; width: 100%; order: 10; flex-basis: 100%; }
  .btn-collapse { order: 5; }
  .btn-student-reset { order: 6; margin-left: 0; }
  .choice { font-size: 11px; padding: 4px 8px; }
  .choice-group { gap: 4px; }
  .next-tab { font-size: 10px; padding: 5px 2px; }
  .out-box { min-height: 200px; font-size: 12px; }
  .bulk-input-area { flex-direction: column; align-items: stretch; }
  .bulk-input-area input { min-width: 0; }
  .btn-collapse { font-size: 11px; }
}
@media (max-width: 400px) {
  .header { font-size: 13px; padding: 10px 12px; }
  .student-num { width: 22px; height: 22px; font-size: 11px; }
  .stage-unit { grid-template-columns: 100px 1fr; }
}

.sent-badge { display:none; background:#d1fae5; color:#065f46; border:1px solid #6ee7b7; border-radius:6px; padding:4px 10px; font-size:12px; font-weight:bold; }
.sent-badge.show { display:inline-flex; align-items:center; gap:4px; }
.global-undo-bar { display:none; background:#fef3c7; color:#92400e; border-bottom: 1px solid #fcd34d; padding:7px 20px; font-size:13px; align-items:center; gap:10px; }
.global-undo-bar.show { display:flex; }
.undo-bar { display:none; background:#fef3c7; color:#92400e; border:1px solid #fcd34d; border-radius:6px; padding:3px 10px; font-size:12px; align-items:center; gap:6px; }
.undo-bar.show { display:inline-flex; }
.btn-undo { background:none; color:#b45309; border:none; padding:0; font-size:12px; font-weight:bold; cursor:pointer; font-family:inherit; text-decoration:underline; }
.bulk-input-area { background:#fffbeb; border:1.5px dashed #fcd34d; border-radius:8px; padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.bulk-input-area label { font-size:11px; font-weight:bold; color:#92400e; margin:0; }
.bulk-input-area input { border:1.5px solid #fcd34d; border-radius:6px; padding:5px 9px; font-size:13px; font-family:inherit; background:white; flex:1; min-width:200px; }
.bulk-input-area input:focus { outline:none; border-color:#ea580c; }
.btn-bulk-gen { background:#ea580c; color:white; border:none; border-radius:6px; padding:6px 14px; font-size:12px; font-weight:bold; cursor:pointer; font-family:inherit; white-space:nowrap; }
.autosave-label { font-size:11px; color:#9ca3af; }
</style>
</head>
<body>

<div class="header">📝 授業報告書ツール｜コードアドベンチャー</div>

<!-- 共通情報バー -->
<div class="common-bar">
  <div><label>授業日</label><input type="date" id="date" style="width:140px;"></div>
  <div><label>担当</label><input id="teacher" placeholder="川上" style="width:100px;"></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px;"><span style="font-size:12px;color:#9ca3af;">生徒数：<strong id="student-count">1</strong>名</span><span class="autosave-label" id="autosaveLabel"></span><button id="btnAdd" style="background:#ea580c;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;">＋ 生徒を追加</button><button id="btnResetTop" class="btn-reset-all" style="padding:6px 12px;font-size:12px;">🔄 全リセット</button><button id="btnSettings" title="設定" style="background:#f3f4f6;border:1.5px solid #e5e7eb;border-radius:6px;padding:6px 10px;font-size:16px;cursor:pointer;line-height:1;">⚙️</button></div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-modal">
    <h2>⚙️ 設定</h2>
    <div class="settings-section">
      <label>冒頭の挨拶文</label>
      <textarea id="cfg-greeting" rows="2"></textarea>
      <div class="settings-hint">デフォルト：「いつもお世話になっております。」</div>
    </div>
    <div class="settings-section">
      <label>署名行（{teacher} は担当者名に自動置換されます）</label>
      <input type="text" id="cfg-signature" />
      <div class="settings-hint">デフォルト：「進学塾クロフネ・コードアドベンチャーの{teacher}です。」</div>
    </div>
    <div class="settings-section">
      <label>絵文字見出し</label>
      <div class="settings-toggle-row">
        <label class="toggle-switch"><input type="checkbox" id="cfg-emoji"><span class="toggle-slider"></span></label>
        <span style="font-size:13px;color:#374151;">絵文字見出しを表示する（📖⭐💬📅💡）</span>
      </div>
    </div>
    <div class="settings-footer">
      <button class="btn-settings-reset" id="btnSettingsReset">デフォルトに戻す</button>
      <button class="btn-settings-cancel" id="btnSettingsCancel">キャンセル</button>
      <button class="btn-settings-save" id="btnSettingsSave">保存</button>
    </div>
  </div>
</div>
<div class="global-undo-bar" id="globalUndoBar">↩ <button class="btn-undo" id="btnGlobalUndo">元に戻す</button> <span style="color:#b45309;font-size:11px;" id="globalUndoMsg"></span></div>

<div class="main">
  <div class="bulk-input-area">
    <label>📋 生徒名をまとめて入力（読点・スペースで区切る）：</label>
    <input type="text" id="bulkNames" placeholder="例：田中、佐藤、山田">
    <button class="btn-bulk-gen" id="btnBulkGen">まとめて生徒を追加</button>
  </div>
  <div class="students-container" id="studentsContainer"></div>
</div>

<div class="bottom-bar">
  <button class="btn-gen-all" id="btnCopyAll" style="background:#059669;">📋 全員分をコピー</button>
  <button class="btn-gen-all" id="btnGenAll">🖊️ 全員分を生成する</button>
  <button class="btn-reset-all" id="btnReset">🔄 全リセット</button>
</div>

<div class="toast" id="toast">✅ コピーしました！</div>

<script>
var STAGES = [
  // ===== 初級 =====
  { cat:'初級', id:'1', name:'Stage 1', sub:'命令の種類を覚える', lessons:[
    { id:'1-1', text:'マインクラフトの基本的な移動方法を覚える', goal:'マインクラフト上でキャラクターを自在に動かせるようになる', skill:'コンピュータに「こうして動いて！」と指示を出すことがプログラミングです。今日はその第一歩として、マインクラフトのキャラクターに命令を出す体験をしました。' },
    { id:'1-2', text:'come, go の命令定義の学習', goal:'命令定義の基本構造を理解し、簡単な命令を作れるようになる', skill:'よく使う動きに名前をつけて、「その名前を呼ぶだけで動いてくれる」という仕組みを学びました。料理でいう「レシピに名前をつけて保存する」ようなイメージです。' },
    { id:'1-3', text:'go の命令定義の中身を変える', goal:'命令の中身を変えて動作をカスタマイズできるようになる', skill:'命令の内容を少し書き換えるだけでキャラクターの動きがガラッと変わる、プログラムの面白さを体験しました。' },
    { id:'1-4', text:'right, left, put の命令定義の学習', goal:'方向指定の命令を使いこなし複雑な動きを実現できるようになる', skill:'前・後・右・左などいくつかの命令を順番に組み合わせることで、複雑な動きを自分で作れるようになりました。' },
  ]},
  { cat:'初級', id:'2', name:'Stage 2', sub:'順次処理を覚える', lessons:[
    { id:'2-1', text:'2〜5手順までの順次処理の学習', goal:'複数の命令を順番に並べて実行できるようになる', skill:'プログラムは上から順番通りに動く、というルールを理解しました。料理のレシピと同じで、手順を間違えると思った通りに動きません。この「順番通りに指示を並べる」考え方はすべてのプログラムの基本です。' },
    { id:'2-2', text:'6手順以上の順次処理の学習', goal:'長い手順を正確に組み立てて実行できるようになる', skill:'たくさんの手順を正確な順番で組み立てる練習をしました。道順を一歩ずつ正確に考えるような力が身につきます。' },
    { id:'2-3', text:'最短距離という考え方の学習', goal:'効率的なルートを考えて命令を最適化できるようになる', skill:'同じゴールにたどり着くとき、命令が少ないほど良いプログラムになります。「もっと短くできないか？」と考える、効率を追い求める力を育てました。' },
    { id:'2-4', text:'拾うコマンドの学習＆順次処理のまとめ', goal:'拾うコマンドを組み合わせた実用的なプログラムが作れるようになる', skill:'移動・拾うなど複数の命令を組み合わせて、実際に役に立つプログラムを作れるようになりました。' },
  ]},
  { cat:'初級', id:'3', name:'Stage 3', sub:'ループの考え方', lessons:[
    { id:'3-1', text:'ループの概念・意義の学習', goal:'繰り返し処理の概念を理解できるようになる', skill:'同じ動きを10回繰り返したいとき、10回分を全部書かなくても「10回繰り返して！」と1回書けばOKな仕組みを学びました。この「繰り返し」の考え方は、プログラミングでとても重要なものです。' },
    { id:'3-2', text:'ループを使った練習問題', goal:'ループを使った基本的なプログラムが作れるようになる', skill:'「繰り返し」をうまく活用して、短くてわかりやすいプログラムを書けるようになりました。長くなりがちな手順をスッキリまとめる力がつきます。' },
    { id:'3-3', text:'ループを使った練習問題（応用）', goal:'ループを応用して複雑な動きを実現できるようになる', skill:'繰り返す回数や動きのパターンを変えることで、見た目には複雑な動きも作れるようになりました。「繰り返し」を自由に使いこなす力が育ちます。' },

var CURRICULUM_ORDER = (function() {
  var allLessons = [];
  STAGES.forEach(function(s){ s.lessons.forEach(function(l){ allLessons.push(l); }); });
  var map = {};
  for (var i = 0; i < allLessons.length - 1; i++) {
    var cur = allLessons[i];
    var next = allLessons[i+1];
    var nextStageObj = null;
    for (var si = 0; si < STAGES.length; si++) {
      for (var li = 0; li < STAGES[si].lessons.length; li++) {
        if (STAGES[si].lessons[li].id === next.id) { nextStageObj = STAGES[si]; break; }
      }
      if (nextStageObj) break;
    }
    if (nextStageObj && nextStageObj.kentei) {
      map[cur.id] = { type:'kentei', val: next.id };
    } else {
      map[cur.id] = { type:'lesson', val: next.id + '：' + next.text };
    }
  }
  return map;
})();

function getNextItem(lessonId) {
  var item = CURRICULUM_ORDER[lessonId];
  if (!item) return null;
  if (item.type === 'lesson') return item.val;
  return null;
}
function getNextKentei(lessonId) {
  var item = CURRICULUM_ORDER[lessonId];
  if (item && item.type === 'kentei') return item.val;
  return null;
}
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

var students = [];
var studentCounter = 0;

function addStudent() {
  var sid = ++studentCounter;
  var s = {
    id: sid,
    selStage: null,
    selLesson: null,
    picks: {},
    nextMode: 'none'
  };
  students.push(s);
  renderStudent(s);
  updateCount();
  updateRemoveButtons();

}

function resetStudent(sid) {
  var s = students.find(function(x){ return x.id === sid; });
  if (!s) return;
  var nameEl = document.getElementById('name-' + sid);
  var name = nameEl ? nameEl.value.trim() : '';
  var msg = name ? name + 'さんの入力をリセットします。よろしいですか？' : 'この生徒の入力をリセットします。よろしいですか？';
  if (!window.confirm(msg)) return;
  var resetMsg = name ? name + 'さんをリセットしました' : 'リセットしました';
  saveUndoState(resetMsg, sid);
  // 入力欄クリア
  ['memo','growth','praise','issue','nextFree'].forEach(function(field){
    var el = document.getElementById(field + '-' + sid);
    if (el) el.value = '';
  });
  // 選択ボタンリセット
  ['attitude','understand','progress'].forEach(function(grp){
    var groupEl = document.getElementById(grp + '-group-' + sid);
    if (groupEl) groupEl.querySelectorAll('.choice').forEach(function(b){ b.classList.remove('sel'); });
  });
  s.picks = {};
  // タイピングボタンリセット
  var typingBtn = document.getElementById('btn-typing-' + sid);
  if (typingBtn) {
    typingBtn.classList.remove('sel');
    typingBtn.innerHTML = '⌨️ タイピング練習';
  }
  // ステージリセット
  resetStage(sid);
  // 出力欄リセット
  var outEl = document.getElementById('output-' + sid);
  if (outEl) outEl.value = '「全員分を生成する」を押してください。';
  var badge = document.getElementById('sent-badge-' + sid);
  if (badge) badge.classList.remove('show');
  clearErr(sid, 'name');
  clearErr(sid, 'stage');
}

function updateCopyLabel(sid) {
  var nameEl = document.getElementById('name-' + sid);
  var labelEl = document.getElementById('copy-name-' + sid);
  var bannerEl = document.getElementById('banner-name-' + sid);
  if (!nameEl) return;
  var name = nameEl.value.trim();
  if (labelEl) labelEl.textContent = name ? name + 'さんをコピー' : 'コピー';
  if (bannerEl) bannerEl.textContent = name ? name + 'さん' : '（未入力）';
}

function removeStudent(sid) {
  if (students.length <= 1) return;
  var nameEl = document.getElementById('name-' + sid);
  var name = nameEl ? nameEl.value.trim() : '';
  var msg = name ? name + 'さんを削除します。よろしいですか？' : 'この生徒を削除します。よろしいですか？';
  if (!window.confirm(msg)) return;
  var removeMsg = name ? name + 'さんを削除しました' : '生徒を削除しました';
  saveUndoState(removeMsg);
  students = students.filter(function(s){ return s.id !== sid; });
  var el = document.getElementById('student-block-' + sid);
  if (el) el.remove();
  renumberStudents();
  updateRemoveButtons();
  updateCount();
}

function updateRemoveButtons() {
  students.forEach(function(s) {
    var btn = document.getElementById('remove-' + s.id);
    if (btn) btn.style.visibility = students.length <= 1 ? 'hidden' : '';
  });
}

function renumberStudents() {
  students.forEach(function(s, i) {
    var numEl = document.querySelector('#student-block-' + s.id + ' .student-num');
    if (numEl) numEl.textContent = i + 1;
  });
}

function updateCount() {
  document.getElementById('student-count').textContent = students.length;
}

function selectStage(sid, stage, el) {
  var s = students.find(function(x){ return x.id === sid; });
  if (!s) return;
  s.selStage = stage;
  s.selLesson = null;
  document.querySelectorAll('#stageList-' + sid + ' .list-item').forEach(function(i){ i.classList.remove('sel'); });
  el.classList.add('sel');
  var ll = document.getElementById('lessonList-' + sid);
  ll.innerHTML = '';
  stage.lessons.forEach(function(l) {
    var d = document.createElement('div');
    d.className = 'list-item';
    d.innerHTML = '<span class="lesson-num">' + l.id + '</span>' + l.text;
    d.addEventListener('click', (function(lesson, elem){ return function(){ selectLesson(sid, lesson, elem); }; })(l, d));
    ll.appendChild(d);
  });
  document.getElementById('goalBox-' + sid).className = 'goal';
  clearErr(sid, 'stage');
  // 単元が1つのステージは自動選択
  if (stage.lessons.length === 1) {
    var firstItem = ll.querySelector('.list-item');
    if (firstItem) firstItem.click();
  }
}

function selectLesson(sid, lesson, el) {
  var s = students.find(function(x){ return x.id === sid; });
  if (!s) return;
  s.selLesson = lesson;
  document.querySelectorAll('#lessonList-' + sid + ' .list-item').forEach(function(i){ i.classList.remove('sel'); });
  el.classList.add('sel');
  var gb = document.getElementById('goalBox-' + sid);
  gb.className = 'goal show';
  var html = '🎯 <strong>達成目標：</strong>' + lesson.goal;
  if (lesson.skill) html += '<br>💡 <strong>今日身に付いたスキル：</strong>' + lesson.skill;
  gb.innerHTML = html;
  clearErr(sid, 'stage');

  setNextByLesson(sid, lesson, false);
}

// lessonを基準に次回予定をセットする共通関数
// sameStage=true → 同じ単元、sameStage=false → 次のステージ
function setNextByLesson(sid, lesson, sameStage) {
  if (!lesson) return;
  var ns = document.getElementById('nextStage-' + sid);
  if (!ns) return;
  if (sameStage) {
    // 同じ単元をセット
    setNext(sid, 'stage');
    for (var i = 0; i < ns.options.length; i++) {
      if (ns.options[i].getAttribute('data-id') === lesson.id) { ns.selectedIndex = i; break; }
    }
  } else {
    // 次のステージをセット
    var nextKenteiId = getNextKentei(lesson.id);
    var nextLesson = getNextItem(lesson.id);
    if (nextKenteiId) {
      setNext(sid, 'stage');
      for (var i = 0; i < ns.options.length; i++) {
        if (ns.options[i].getAttribute('data-id') === nextKenteiId) { ns.selectedIndex = i; break; }
      }
    } else if (nextLesson) {
      setNext(sid, 'stage');
      for (var i = 0; i < ns.options.length; i++) {
        if (ns.options[i].value === nextLesson) { ns.selectedIndex = i; break; }
      }
    }
  }
}

function resetStage(sid) {
  var s = students.find(function(x){ return x.id === sid; });
  if (!s) return;
  s.selStage = null; s.selLesson = null;
  document.querySelectorAll('#stageList-' + sid + ' .list-item').forEach(function(i){ i.classList.remove('sel'); });
  document.getElementById('lessonList-' + sid).innerHTML = '<div class="list-item" style="color:#9ca3af;cursor:default;">← ステージを選択</div>';
  document.getElementById('goalBox-' + sid).className = 'goal';
  setNext(sid, 'none');
}

function pick(btn, sid, grp) {
  var s = students.find(function(x){ return x.id === sid; });
  if (!s) return;
  var groupEl = document.getElementById(grp + '-group-' + sid);
  if (groupEl) groupEl.querySelectorAll('.choice').forEach(function(b){ b.classList.remove('sel'); });
  btn.classList.add('sel');
  s.picks[grp] = { val: btn.getAttribute('data-v'), tone: btn.getAttribute('data-tone') || 'mid' };
  // 授業進度に応じて次回予定を自動セット（ステージ選択済みの場合のみ）
  if (grp === 'progress' && s.selLesson) {
    var val = btn.getAttribute('data-v');
    var isCarryOver = (val === '少し残ったが概ね完了' || val === '次回も同じステージを続ける');
    setNextByLesson(sid, s.selLesson, isCarryOver);
  }
  scheduleAutoSave();
}

function setNext(sid, t) {

}

function generateOne(sid) {

  var d = date ? new Date(date + 'T00:00:00') : new Date();

  var nameStr = name + 'さん';

  var nextTxt = '';

  var selStage = s.selStage;

  function buildContentSentence() {

  function buildSituationSentence() {

    var undArr = {'すらすら進められた':['内容をしっかり理解しながら、スムーズに進めることができました！','今日は理解が早く、つまずかずに進められていました！','内容をよく理解しながら、テンポよく取り組めていました！','どんどん先へ進めることができました！','理解が早く、とてもスムーズに進んでいました！','一つひとつ確認しながら、順調に進めることができました！'],'概ね理解して進められた':['内容を概ね理解しながら、着実に進めることができました。','大きくつまずくことなく、進めることができていました。','全体的によく理解しながら、丁寧に取り組めていました。','要点を押さえながら、落ち着いて進めることができました。','概ね理解できており、安定したペースで取り組めていました。','内容を理解しながら、着実に進めることができました。'],'少し詰まりながらも自分で解決できた':['難しい部分で手が止まる場面もありましたが、自分で考えて進めることができました。','考え込む場面もありましたが、最後まで諦めずに取り組めていました。','少し苦戦する場面もありましたが、粘り強く考えられていました。','難しい箇所でも、じっくり考えて答えを出すことができました。','詰まる場面もありましたが、試行錯誤しながら進めることができました。','簡単ではない内容でしたが、最後まで考えながら取り組めていました。'],'一緒に考えながら進めた':['難しい箇所は一緒に確認しながら進めることができました。','サポートをしながら、一緒に取り組むことができました。','少し難しい内容でしたが、一緒に考えながら進めました。','手が止まる場面では、ヒントを出しながら解決していきました。','確認を重ねながら、丁寧に進めることができました。','一緒に考えながら、理解を深めることができました。']};
    var prgArr = {'予定より進んだ':['今日は予定より先まで進めることができました！','予定していた範囲を超えて進めることができました！','順調に進み、予定以上の内容に取り組めました！','テンポよく進み、予定より多く進めることができました！','ペースよく進めることができました！','計画以上に進めることができました！'],'予定通り完了':['今日の予定範囲をしっかり終えることができました。','計画通りに進めることができました。','予定していた内容をしっかり終えることができました。','今日の目標を達成することができました。','予定範囲をしっかり進めることができました。','着実に進めることができました。'],'少し残ったが概ね完了':['少し残った部分はありますが、主な内容は進めることができました。','すべては終わりませんでしたが、大切な部分は確認できました。','少し残りましたが、内容はしっかり理解できていました。','時間の関係で少し残りましたが、次回続きから進めます。','すべては終わりませんでしたが、内容はしっかり身についていました。','少し残っていますが、次回もスムーズに進められそうです。'],'次回も同じステージを続ける':['次回も丁寧に進めていきます。','引き続き、じっくり取り組んでいきます。','繰り返し取り組みながら、理解を深めていきます。','焦らず着実に進めていきます。','次回も続けて取り組んでいく予定です。','しっかり身につけられるよう進めていきます。']};
    if (!attitude && !understand && !progress) return null;
    var attTxt = attitude ? rnd(attArr[attitude] || [attitude + '。']) : '';
    var undTxt = understand ? rnd(undArr[understand] || [understand + '。']) : '';
    var prgOptions = progress ? (prgArr[progress] || [progress + '。']) : [''];

      parts = [attTxt, bridge];

  function buildMemoSentence(t, isMain) { if (!t) return null; var cleaned = t.replace(/[、。]$/, ''); return isMain ? '本日は' + cleaned + 'を中心に取り組みました。' : '今日は' + cleaned + 'にも取り組みました。'; }
  function buildGrowthSentence(txt) {

    return rnd(['今日は「'+txt+'」ができるようになりました。','「'+txt+'」という成長が見られました。',txt+'という点で成長を感じました。']);

  function buildIssueSentence(txt) {
    if (!txt) return null;
    var ai = txt.indexOf('→');
    if (ai !== -1) { var ip=txt.slice(0,ai).trim(), sp=txt.slice(ai+1).trim(); return rnd(['課題として「'+ip+'」という点がありました。次回は'+sp+'予定です。','「'+ip+'」という点が課題でしたので、次回は'+sp+'ようにサポートしてまいります。',ip+'という課題がありましたので、次回は'+sp+'ことで改善を図っていきます。']); }
    return rnd(['課題として、'+txt+'という点がありました。次回も引き続きサポートしてまいります。','改善点として、'+txt+'という点がありましたので、次回のフォローを検討しています。',txt+'という課題もありましたが、次回に向けてしっかり対応してまいります。','今後の課題として、'+txt+'という点を意識しながら進めていきます。']);
  }
  function buildClosing(ns) { return rnd(['引き続き'+ns+'の成長をサポートしてまいります。何かございましたらお気軽にご連絡ください😊',ns+'の頑張りをこれからもしっかり応援してまいります😊','次回も'+ns+'のペースに合わせて進めてまいります😊','今後も'+ns+'の成長を丁寧に見守ってまいります😊','引き続き、安心して通っていただけるようサポートしてまいります😊','ご不明な点などございましたら、いつでもご連絡ください😊']); }

  var contentSentence = buildContentSentence();

  var skillLine = buildSkillLine();

    if (s.nextMode === 'stage') {
      if (/^K[1-4]：/.test(nextTxt)) {

      } else {

  L.push(buildClosing(nameStr));

  var outEl = document.getElementById('output-' + sid);
  if (outEl) outEl.value = L.join('\n');
  return true;
}

function copyAll() {
  var parts = [];
  students.forEach(function(s) {
    var el = document.getElementById('output-' + s.id);
    if (!el) return;
    var txt = el.value.trim();
    if (!txt || txt === '「全員分を生成する」を押してください。') return;
    var nameEl = document.getElementById('name-' + s.id);
    var name = nameEl ? nameEl.value.trim() : '';
    if (parts.length > 0) parts.push('━━━━━━━━━━━━━━━━━━━━');
    if (name) parts.push('【' + name + 'さん】');
    parts.push(txt);
  });
  if (!parts.length) { alert('先に「全員分を生成する」を押してください。'); return; }
  var text = parts.join('\n');
  function onSuccess() {
    var btn = document.getElementById('btnCopyAll');
    if (btn) { var orig = btn.textContent; btn.textContent = '✅ コピーしました！'; setTimeout(function(){ btn.textContent = orig; }, 2000); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(function(){ copyFallback(text, onSuccess); });
  } else {
    copyFallback(text, onSuccess);
  }
}

function generateAll() {
  // 全生徒の送信済みバッジをリセット
  students.forEach(function(s) {
    var badge = document.getElementById('sent-badge-' + s.id);
    if (badge) badge.classList.remove('show');
  });
  var allOk = true;
  students.forEach(function(s) {
    var ok = generateOne(s.id);
    if (!ok) allOk = false;
  });
  if (!allOk) {
    // エラーがある生徒までスクロール
    var errEl = document.querySelector('.err, .err-msg.show');
    if (errEl) errEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function doCopy(sid) {
  var el = document.getElementById('output-' + sid);
  if (!el) return;
  var text = el.value;
  function onSuccess() {
    showToast();
    var badge = document.getElementById('sent-badge-' + sid);
    if (badge) badge.classList.add('show');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(function(){ copyFallback(text, onSuccess); });
    return;
  }
  el.select(); el.setSelectionRange(0, 99999);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  if (!ok) { copyFallback(text, onSuccess); return; }
  onSuccess();
}

function copyFallback(text, onSuccess) {
  var tmp = document.createElement('textarea');
  tmp.value = text; tmp.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
  document.body.appendChild(tmp); tmp.focus(); tmp.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(tmp);
  if (ok) { if (onSuccess) onSuccess(); }
  else { alert('コピーできませんでした。出力欄を全選択してコピーしてください。'); }
}

function showToast() {
  var t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

function resetAll() {
  if (!window.confirm('全生徒の入力をリセットします。よろしいですか？')) return;
  saveUndoState('全リセットしました');
  var container = document.getElementById('studentsContainer');
  container.innerHTML = '';
  students = [];
  studentCounter = 0;
  addStudent();
  clearAutoSave();
}

    var bar = document.getElementById('undo-bar-' + sid);
    var msgEl2 = document.getElementById('undo-msg-' + sid);
    if (msgEl2) msgEl2.textContent = (msg || 'リセットしました');
    if (bar) {
      bar.classList.add('show');
      window._undoTimer = setTimeout(function(){ bar.classList.remove('show'); }, 8000);
    }
  } else {
    // グローバル（削除・全リセット時）
    var msgEl = document.getElementById('globalUndoMsg');
    if (msgEl) msgEl.textContent = msg || '';
    if (gb) {
      gb.classList.add('show');
      window._undoTimer = setTimeout(function(){ gb.classList.remove('show'); }, 8000);
    }
  }
}

function doUndo() {
  if (!undoState) return;
  restoreData(undoState.data);
  undoState = null;
  students.forEach(function(s) {
    var b = document.getElementById('undo-bar-' + s.id);
    if (b) b.classList.remove('show');
  });
  var gb = document.getElementById('globalUndoBar');
  if (gb) gb.classList.remove('show');
}

// ===== 自動保存 =====
var AUTOSAVE_KEY = 'ca_autosave_v2';
var SETTINGS_KEY = 'ca_settings_v1';
var SETTINGS_DEFAULT = {
  greeting: 'いつもお世話になっております。',
  signature: '進学塾クロフネ・コードアドベンチャーの{teacher}です。',
  emoji: true
};
var currentSettings = JSON.parse(JSON.stringify(SETTINGS_DEFAULT));
function loadSettings() {
  try {
    var raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) { var saved = JSON.parse(raw); Object.assign(currentSettings, saved); }
  } catch(e) {}
}
function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(currentSettings));
}
function getEmoji(e) {
  return currentSettings.emoji ? e + ' ' : '';
}
var autoSaveTimer = null;

function collectAllData() {
  var data = {
    date: document.getElementById('date').value,
    teacher: document.getElementById('teacher').value,
    students: []
  };
  students.forEach(function(s) {
    var sd = { id: s.id, picks: s.picks, nextMode: s.nextMode };
    ['name','memo','growth','praise','issue','nextFree'].forEach(function(f){
      var el = document.getElementById(f + '-' + s.id);
      sd[f] = el ? el.value : '';
    });
    var nsEl = document.getElementById('nextStage-' + s.id);
    sd.nextStageVal = nsEl ? nsEl.value : '';
    sd.selStageId  = s.selStage  ? s.selStage.id  : null;
    sd.selLessonId = s.selLesson ? s.selLesson.id : null;
    data.students.push(sd);
  });
  return data;
}

function scheduleAutoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(function(){
    try {
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(collectAllData()));
      var lbl = document.getElementById('autosaveLabel');
      if (lbl) { lbl.textContent = '💾 保存済み'; setTimeout(function(){ lbl.textContent = ''; }, 2000); }
    } catch(e) {}
  }, 1500);
}

function clearAutoSave() {
  localStorage.removeItem(AUTOSAVE_KEY);
}

function tryRestoreAutoSave() {
  try {
    var raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return;
    var data = JSON.parse(raw);
    if (!data || !data.students || !data.students.length) return;
    var hasContent = data.students.some(function(s){ return s.name && s.name.trim(); });
    if (!hasContent) return;
    var names = data.students.map(function(s){ return s.name || '（名前なし）'; }).join('、');
    if (!window.confirm('前回の入力データがあります。\n生徒：' + names + '\n\n復元しますか？')) {
      clearAutoSave(); return;
    }
    restoreData(data);
  } catch(e) {}
}

function restoreData(data) {
  var container = document.getElementById('studentsContainer');
  container.innerHTML = '';
  students = [];
  studentCounter = 0;
  if (data.date) document.getElementById('date').value = data.date;
  if (data.teacher) document.getElementById('teacher').value = data.teacher;
  data.students.forEach(function(sd) {
    addStudent();
    var sid = students[students.length - 1].id;
    var s   = students[students.length - 1];
    ['name','memo','growth','praise','issue','nextFree'].forEach(function(f){
      var el = document.getElementById(f + '-' + sid);
      if (el && sd[f]) el.value = sd[f];
    });
    updateCopyLabel(sid);
    if (sd.nextMode) setNext(sid, sd.nextMode);
    if (sd.picks) {
      s.picks = sd.picks;
      ['attitude','understand','progress'].forEach(function(grp){
        var p = sd.picks[grp]; if (!p) return;
        var g = document.getElementById(grp + '-group-' + sid); if (!g) return;
        g.querySelectorAll('.choice').forEach(function(btn){
          if (btn.getAttribute('data-v') === p.val) btn.classList.add('sel');
        });
      });
    }
    if (sd.selStageId) {
      var stage = STAGES.find(function(st){ return st.id === sd.selStageId; });
      if (stage) {
        var items = document.querySelectorAll('#stageList-' + sid + ' .list-item');
        items.forEach(function(el){
          if (el.querySelector && el.querySelector('div') && el.querySelector('div').textContent === stage.name) {
            el.click();
          }
        });
        if (sd.selLessonId) {
          // sidとnextStageValをクロージャでキャプチャして復元
          (function(capturedSid, capturedNextStageVal, capturedNextMode) {
            setTimeout(function(){
              document.querySelectorAll('#lessonList-' + capturedSid + ' .list-item').forEach(function(el){
                if (el.textContent.indexOf(sd.selLessonId) !== -1) el.click();
              });
              // lesson.click()でsetNextByLessonが走るので、保存済みの次回予定で上書き復元
              if (capturedNextMode === 'stage' && capturedNextStageVal) {
                setNext(capturedSid, 'stage');
                var ns = document.getElementById('nextStage-' + capturedSid);
                if (ns) {
                  for (var i = 0; i < ns.options.length; i++) {
                    if (ns.options[i].value === capturedNextStageVal) { ns.selectedIndex = i; break; }
                  }
                }
              } else if (capturedNextMode && capturedNextMode !== 'stage') {
                setNext(capturedSid, capturedNextMode);
              }
            }, 80);
          })(sid, sd.nextStageVal, sd.nextMode);
        }
      }
    }
  });
  updateCount();
  updateRemoveButtons();
}

// ===== 一括生徒名入力 =====
function processBulkNames() {
  var input = document.getElementById('bulkNames');
  if (!input || !input.value.trim()) return;
  var names = input.value.trim().split(/[、，,\s　]+/).map(function(n){ return n.trim(); }).filter(Boolean);
  if (!names.length) return;
  saveUndoState('一括入力');
  var container = document.getElementById('studentsContainer');
  container.innerHTML = '';
  students = [];
  studentCounter = 0;
  names.forEach(function(name) {
    addStudent();
    var sid = students[students.length - 1].id;
    var el = document.getElementById('name-' + sid);
    if (el) { el.value = name; updateCopyLabel(sid); }
  });
  updateCount();
  updateRemoveButtons();
  input.value = '';
}

// 初期化
window.onload = function() {
  loadSettings();
  var overlay = document.getElementById('settingsOverlay');
  var cfgGreeting = document.getElementById('cfg-greeting');
  var cfgSignature = document.getElementById('cfg-signature');
  var cfgEmoji = document.getElementById('cfg-emoji');
  function openSettings() {
    cfgGreeting.value = currentSettings.greeting;
    cfgSignature.value = currentSettings.signature;
    cfgEmoji.checked = currentSettings.emoji;
    overlay.classList.add('show');
  }
  function closeSettings() { overlay.classList.remove('show'); }
  document.getElementById('btnSettings').addEventListener('click', openSettings);
  document.getElementById('btnSettingsCancel').addEventListener('click', closeSettings);
  document.getElementById('btnSettingsSave').addEventListener('click', function() {
    currentSettings.greeting = cfgGreeting.value.trim() || SETTINGS_DEFAULT.greeting;
    currentSettings.signature = cfgSignature.value.trim() || SETTINGS_DEFAULT.signature;
    currentSettings.emoji = cfgEmoji.checked;
    saveSettings();
    closeSettings();
  });
  document.getElementById('btnSettingsReset').addEventListener('click', function() {
    if (!confirm('設定をデフォルトに戻しますか？')) return;
    currentSettings = JSON.parse(JSON.stringify(SETTINGS_DEFAULT));
    saveSettings();
    cfgGreeting.value = currentSettings.greeting;
    cfgSignature.value = currentSettings.signature;
    cfgEmoji.checked = currentSettings.emoji;
  });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeSettings(); });
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
  var savedTeacher = localStorage.getItem('ca_teacher');
  if (savedTeacher) document.getElementById('teacher').value = savedTeacher;
  addStudent();
  document.getElementById('btnAdd').addEventListener('click', addStudent);
  document.getElementById('btnReset').addEventListener('click', resetAll);
  document.getElementById('btnResetTop').addEventListener('click', resetAll);
  document.getElementById('btnGenAll').addEventListener('click', generateAll);
  document.getElementById('btnCopyAll').addEventListener('click', copyAll);
  document.getElementById('btnBulkGen').addEventListener('click', processBulkNames);
  document.getElementById('bulkNames').addEventListener('keydown', function(e){ if (e.key === 'Enter') processBulkNames(); });
  document.getElementById('btnGlobalUndo').addEventListener('click', doUndo);
  // undoボタンはrenderStudent内で登録
  document.getElementById('date').addEventListener('change', scheduleAutoSave);
  document.getElementById('teacher').addEventListener('input', scheduleAutoSave);
  tryRestoreAutoSave();
};
</script>
